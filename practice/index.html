<!-- Local MathJax v3.2.1. Question content is injected dynamically, so the
     practice engine explicitly calls MathJax.typesetPromise() after render. -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]'], ['$$', '$$']]
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  },
  startup: {
    typeset: false,
    pageReady: function () {
      return MathJax.startup.defaultPageReady().then(function () {
        var queued = window.__dynancaMathQueue || [];
        window.__dynancaMathQueue = [];
        return queued.reduce(function (promise, el) {
          return promise.then(function () {
            if (el && el.isConnected) return MathJax.typesetPromise([el]);
          });
        }, Promise.resolve());
      });
    }
  }
};
</script>
<script id="MathJax-script" async src="../assets/vendor/mathjax/tex-chtml-full.js"></script>
